[build-system]
requires = ["setuptools>=65.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tradmind-nepse-chatbot"
version = "1.0.0"
description = "Educational chatbot for Nepal Stock Exchange (NEPSE)"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "TradeMind Team"}
]
keywords = ["nepse", "stockmarket", "chatbot", "nepal", "fastapi"]

dependencies = [
    "fastapi==0.135.1",
    "uvicorn[standard]==0.18.3",
    "flask==3.1.3",
    "python-dotenv==1.2.2",
    "httpx==0.28.1",
    "httpx-sse==0.4.3",
    "langchain==1.2.13",
    "langchain-core==1.2.20",
    "langchain-community==0.4.1",
    "langchain-classic==1.0.3",
    "langchain-text-splitters==1.1.1",
    "langgraph==1.1.3",
    "langgraph-sdk==0.3.12",
    "langgraph-prebuilt==1.0.8",
    "langgraph-checkpoint==4.0.1",
    "langsmith==0.7.22",
    "chromadb==1.5.5",
    "sentence-transformers==5.3.0",
    "transformers==5.3.0",
    "huggingface-hub==1.7.2",
    "torch==2.4.0",
    "scikit-learn==1.5.0",
    "onnxruntime==1.18.0",
    "numpy==2.0.0",
    "pandas==2.2.0",
    "scipy==1.14.0",
    "groq==0.9.0",
    "tenacity==9.1.4",
    "pydantic==2.12.5",
    "pydantic-core==2.41.5",
    "pydantic-settings==2.13.1",
    "httpcore==1.0.9",
    "aiohttp==3.13.3",
    "anyio==4.12.1",
    "SQLAlchemy==2.0.48",
    "dataclasses-json==0.6.7",
    "python-dateutil==2.9.0.post0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.20",
    "black>=23.0",
    "ruff>=0.1",
    "mypy>=1.0",
]

[project.urls]
Homepage = "https://github.com/yourusername/tradmind-chatbot"
Documentation = "https://github.com/yourusername/tradmind-chatbot/blob/main/README.md"
Repository = "https://github.com/yourusername/tradmind-chatbot.git"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "tests*"]

[tool.black]
line-length = 100
target-version = ["py310", "py311"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
